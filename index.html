<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Arcade Tennis</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    h2 {
      margin: 2px 0;
      font-size: 16px;
      letter-spacing: 2px;
    }
    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #008080;
      border: 3px solid #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      padding: 6px;
      width: 100vw;
      max-width: 420px;
      box-sizing: border-box;
    }
    canvas {
      background-color: #008080;
      display: block;
      width: 100%;
      height: auto;
      max-height: 50vh;
    }
    /* アーケード筐体風のコントローラー台座 */
    .controller {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 8px;
      background-color: #b0b0b0;
      border: 3px solid #333;
      padding: 12px 20px;
      box-sizing: border-box;
      border-radius: 6px;
    }
    /* アーケードスティック */
    .joystick-base {
      position: relative;
      width: 100px;
      height: 100px;
      background-color: #222;
      border-radius: 50%;
      border: 3px solid #444;
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.8);
      touch-action: none;
    }
    .joystick-stick {
      position: absolute;
      top: 25px;
      left: 25px;
      width: 50px;
      height: 50px;
      background: radial-gradient(circle at 30% 30%, #ff3333, #990000);
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
      cursor: pointer;
      transition: transform 0.05s ease-out;
    }

    .action-buttons {
      display: flex;
      gap: 20px;
    }
    .btn-action-container {
      text-align: center;
    }
    .btn-action {
      width: 55px;
      height: 55px;
      background-color: #cc1111;
      color: #fff;
      border: 3px solid #7f1d1d;
      border-radius: 50%;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 5px 0 #7f1d1d;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-action:active, .btn-action.touch-active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #7f1d1d;
    }
  </style>
</head>
<body>

  <h2>RETRO TENNIS</h2>
  
  <div id="game-container">
    <canvas id="gameCanvas" width="384" height="432"></canvas>
    
    <!-- アーケード風コントローラー -->
    <div class="controller">
      <!-- ジョイスティック -->
      <div class="joystick-base" id="joystickBase">
        <div class="joystick-stick" id="joystickStick"></div>
      </div>
      <!-- A・Bボタン -->
      <div class="action-buttons">
        <div class="btn-action-container">
          <button class="btn-action" id="btn-b">B</button>
          <span style="font-size:11px; color:#222; font-weight:bold;">ロブ</span>
        </div>
        <div class="btn-action-container">
          <button class="btn-action" id="btn-a">A</button>
          <span style="font-size:11px; color:#222; font-weight:bold;">ショット</span>
        </div>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// スコア
let scorePlayer = 0;
let scoreCpu = 0;

// キャラクターとボール
const player = { x: 240, y: 380, speed: 3.5 };
const cpu = { x: 192, y: 80, speed: 2.2 };
const ball = { x: 240, y: 370, z: 0, vx: 0, vy: 0, vz: 0, active: false };

// 入力状態（ジョイスティックの移動ベクトル vx, vy）
const input = { moveX: 0, moveY: 0, a: false, b: false };

// --- キーボード操作対応（矢印キーでスティック代わり） ---
const keys = { up: false, down: false, left: false, right: false };
window.addEventListener('keydown', e => {
  if (e.code === 'ArrowUp') keys.up = true;
  if (e.code === 'ArrowDown') keys.down = true;
  if (e.code === 'ArrowLeft') keys.left = true;
  if (e.code === 'ArrowRight') keys.right = true;
  if (e.code === 'KeyZ' || e.code === 'Space') input.a = true;
  if (e.code === 'KeyX') input.b = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowUp') keys.up = false;
  if (e.code === 'ArrowDown') keys.down = false;
  if (e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'KeyZ' || e.code === 'Space') input.a = false;
  if (e.code === 'KeyX') input.b = false;
});

// --- アーケードスティック（タッチ・マウス操作）の実装 ---
const base = document.getElementById('joystickBase');
const stick = document.getElementById('joystickStick');
const maxDist = 30; // スティックが動く最大距離

function handleJoystickMove(clientX, clientY) {
  const rect = base.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  
  let dx = clientX - centerX;
  let dy = clientY - centerY;
  let dist = Math.hypot(dx, dy);

  if (dist > maxDist) {
    dx = (dx / dist) * maxDist;
    dy = (dy / dist) * maxDist;
    dist = maxDist;
  }

  // スティックの見た目の位置を更新
  stick.style.transform = `translate(${dx}px, ${dy}px)`;

  // 移動量を正規化(-1 〜 1)して入力に反映
  input.moveX = dx / maxDist;
  input.moveY = dy / maxDist;
}

function resetJoystick() {
  stick.style.transform = `translate(0px, 0px)`;
  input.moveX = 0;
  input.moveY = 0;
}

// マウスイベント
let isDragging = false;
base.addEventListener('mousedown', (e) => { isDragging = true; handleJoystickMove(e.clientX, e.clientY); });
window.addEventListener('mousemove', (e) => { if (isDragging) handleJoystickMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; resetJoystick(); } });

// タッチイベント（スマホ用グリグリ操作）
base.addEventListener('touchstart', (e) => {
  e.preventDefault();
  isDragging = true;
  handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: false});

window.addEventListener('touchmove', (e) => {
  if (isDragging) {
    e.preventDefault();
    handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY);
  }
}, {passive: false});

window.addEventListener('touchend', () => {
  if (isDragging) {
    isDragging = false;
    resetJoystick();
  }
});

// A・Bボタンのセットアップ
function setupActionButton(id, keyName) {
  const el = document.getElementById(id);
  if (!el) return;
  const activate = (e) => { e.preventDefault(); input[keyName] = true; el.classList.add('touch-active'); };
  const deactivate = (e) => { e.preventDefault(); input[keyName] = false; el.classList.remove('touch-active'); };

  el.addEventListener('mousedown', activate);
  el.addEventListener('mouseup', deactivate);
  el.addEventListener('mouseleave', deactivate);
  el.addEventListener('touchstart', activate, {passive: false});
  el.addEventListener('touchend', deactivate, {passive: false});
}
setupActionButton('btn-a', 'a');
setupActionButton('btn-b', 'b');

// サーブ・ラリー位置のリセット
function resetRally(server) {
  if (server === 'player') {
    player.x = 240;
    player.y = 380;
    ball.x = 240;
    ball.y = 370;
  } else {
    cpu.x = 192;
    cpu.y = 70;
    ball.x = 192;
    ball.y = 90;
  }
  ball.z = 0;
  ball.vx = 0;
  ball.vy = 0;
  ball.vz = 0;
  ball.active = false;
}
resetRally('player');

function update() {
  // キーボード入力をベクトルに合成
  let kx = 0, ky = 0;
  if (keys.left) kx = -1;
  if (keys.right) kx = 1;
  if (keys.up) ky = -1;
  if (keys.down) ky = 1;

  let mx = input.moveX !== 0 ? input.moveX : kx;
  let my = input.moveY !== 0 ? input.moveY : ky;

  // プレイヤー移動（なめらかな全方位移動）
  player.x += mx * player.speed;
  player.y += my * player.speed;

  // コート内制限
  if (player.x < 48) player.x = 48;
  if (player.x > 336) player.x = 336;
  if (player.y < 230) player.y = 230;
  if (player.y > 400) player.y = 400;

  // CPU AI
  if (ball.active) {
    if (cpu.x < ball.x - 4) cpu.x += cpu.speed;
    else if (cpu.x > ball.x + 4) cpu.x -= cpu.speed;
  } else {
    if (cpu.x < 192) cpu.x += cpu.speed;
    else if (cpu.x > 192) cpu.x -= cpu.speed;
  }
  if (cpu.x < 48) cpu.x = 48;
  if (cpu.x > 336) cpu.x = 336;

  // ボール移動
  if (ball.active) {
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.z += ball.vz;
    ball.vz -= 0.14; // 重力

    if (ball.z <= 0) {
      ball.z = 0;
      if (ball.y < 40) {
        scorePlayer++;
        resetRally('cpu');
      } else if (ball.y > 392) {
        scoreCpu++;
        resetRally('player');
      }
    }
  }

  // サーブ / ショット入力
  if (!ball.active && input.a) {
    ball.active = true;
    ball.vx = -1.2;
    ball.vy = -4.5;
    ball.vz = 2.2;
  } else if (ball.active) {
    let distP = Math.hypot(player.x - ball.x, player.y - ball.y);
    if (distP < 35 && ball.y > 200 && ball.y < 390) {
      if (input.a) {
        ball.vy = -5.0;
        ball.vz = 1.5;
        ball.vx = (ball.x - player.x) * 0.15;
      } else if (input.b) {
        ball.vy = -3.2;
        ball.vz = 4.8; // ロブ
        ball.vx = (ball.x - player.x) * 0.1;
      }
    }

    let distC = Math.hypot(cpu.x - ball.x, cpu.y - ball.y);
    if (distC < 35 && ball.y < 230 && ball.y > 50) {
      ball.vy = 5.0;
      ball.vz = 1.5;
      ball.vx = (ball.x - cpu.x) * 0.15;
    }
  }
}

// ドット絵風キャラ描画
function drawRetroCharacter(x, y, isPlayer) {
  ctx.save();
  ctx.translate(x, y);
  
  ctx.fillStyle = isPlayer ? '#ff69b4' : '#00fa9a';
  ctx.fillRect(-8, -10, 16, 16);
  
  ctx.fillStyle = '#ffdead';
  ctx.fillRect(-6, -20, 12, 11);
  ctx.fillStyle = '#222';
  ctx.fillRect(-6, -22, 12, 5);
  
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  if (isPlayer) {
    ctx.beginPath(); ctx.ellipse(12, -8, 6, 8, Math.PI/4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(-12, -8, 6, 8, -Math.PI/4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
  
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#008080';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // コート本体
  ctx.fillStyle = '#228b22';
  ctx.fillRect(48, 40, 288, 352);

  // 白線
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.strokeRect(48, 40, 288, 352);

  ctx.beginPath();
  ctx.moveTo(192, 40);
  ctx.lineTo(192, 392);
  ctx.stroke();

  ctx.strokeRect(48, 120, 288, 192);

  // ネット
  ctx.fillStyle = '#111';
  ctx.fillRect(38, 212, 308, 12);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(38, 212, 308, 12);

  // スコア・案内
  ctx.fillStyle = '#fff';
  ctx.font = '13px "Courier New"';
  ctx.fillText(`CPU: ${scoreCpu}`, 55, 25);
  ctx.fillText(`YOU: ${scorePlayer}`, 55, 415);
  ctx.fillText(ball.active ? "ラリー中! [A]ショット [B]ロブ" : "ベースラインから [A]サーブ！", 110, 25);

  // キャラクター描画
  drawRetroCharacter(player.x, player.y, true);
  drawRetroCharacter(cpu.x, cpu.y, false);

  // ボールと影
  let shadowY = ball.y + ball.z;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.arc(ball.x, shadowY, 4, 0, Math.PI*2); ctx.fill();

  let ballScreenY = ball.y - ball.z;
  ctx.fillStyle = '#ffffe0';
  ctx.beginPath(); ctx.arc(ball.x, ballScreenY, 5, 0, Math.PI*2); ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
