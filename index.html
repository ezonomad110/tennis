<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro 3D Tennis Game</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    h2 {
      margin: 2px 0;
      font-size: 16px;
      letter-spacing: 2px;
    }
    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #008080;
      border: 3px solid #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      padding: 6px;
      width: 100vw;
      max-width: 420px;
      box-sizing: border-box;
    }
    canvas {
      background-color: #008080;
      display: block;
      width: 100%;
      height: auto;
      max-height: 50vh;
    }
    .controller {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 8px;
      background-color: #b0b0b0;
      border: 3px solid #333;
      padding: 12px 20px;
      box-sizing: border-box;
      border-radius: 6px;
    }
    .joystick-base {
      position: relative;
      width: 100px;
      height: 100px;
      background-color: #222;
      border-radius: 50%;
      border: 3px solid #444;
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.8);
      touch-action: none;
    }
    .joystick-stick {
      position: absolute;
      top: 25px;
      left: 25px;
      width: 50px;
      height: 50px;
      background: radial-gradient(circle at 30% 30%, #ff3333, #990000);
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
      cursor: pointer;
      transition: transform 0.05s ease-out;
    }
    .action-buttons {
      display: flex;
      gap: 20px;
    }
    .btn-action-container {
      text-align: center;
    }
    .btn-action {
      width: 55px;
      height: 55px;
      background-color: #cc1111;
      color: #fff;
      border: 3px solid #7f1d1d;
      border-radius: 50%;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 5px 0 #7f1d1d;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-action:active, .btn-action.touch-active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #7f1d1d;
    }
  </style>
</head>
<body>

  <h2>RETRO TENNIS</h2>
  
  <div id="game-container">
    <canvas id="gameCanvas" width="384" height="432"></canvas>
    
    <div class="controller">
      <div class="joystick-base" id="joystickBase">
        <div class="joystick-stick" id="joystickStick"></div>
      </div>
      <div class="action-buttons">
        <div class="btn-action-container">
          <button class="btn-action" id="btn-b">B</button>
          <span style="font-size:11px; color:#222; font-weight:bold;">ロブ</span>
        </div>
        <div class="btn-action-container">
          <button class="btn-action" id="btn-a">A</button>
          <span style="font-size:11px; color:#222; font-weight:bold;">ショット</span>
        </div>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- 画像読み込み（IMG_8747.JPG） ---
const spriteSheet = new Image();
spriteSheet.src = 'IMG_8747.JPG';
let imageLoaded = false;
spriteSheet.onload = () => { imageLoaded = true; };

// スコア
let scorePlayer = 0;
let scoreCpu = 0;

// キャラクターとボール
const player = { x: 192, y: 350, speed: 3.5 };
const cpu = { x: 192, y: 110, speed: 2.2 };
const ball = { x: 192, y: 330, z: 0, vx: 0, vy: 0, vz: 0, active: false };

// ヒットエフェクト管理
let effect = { x: 0, y: 0, timer: 0 };
const input = { moveX: 0, moveY: 0, a: false, b: false };

// キーボード操作
const keys = { up: false, down: false, left: false, right: false };
window.addEventListener('keydown', e => {
  if (e.code === 'ArrowUp') keys.up = true;
  if (e.code === 'ArrowDown') keys.down = true;
  if (e.code === 'ArrowLeft') keys.left = true;
  if (e.code === 'ArrowRight') keys.right = true;
  if (e.code === 'KeyZ' || e.code === 'Space') input.a = true;
  if (e.code === 'KeyX') input.b = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowUp') keys.up = false;
  if (e.code === 'ArrowDown') keys.down = false;
  if (e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'KeyZ' || e.code === 'Space') input.a = false;
  if (e.code === 'KeyX') input.b = false;
});

// アーケードスティック操作
const base = document.getElementById('joystickBase');
const stick = document.getElementById('joystickStick');
const maxDist = 30;

function handleJoystickMove(clientX, clientY) {
  const rect = base.getBoundingClientRect();
  let dx = clientX - (rect.left + rect.width / 2);
  let dy = clientY - (rect.top + rect.height / 2);
  let dist = Math.hypot(dx, dy);
  if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
  input.moveX = dx / maxDist;
  input.moveY = dy / maxDist;
}

function resetJoystick() {
  stick.style.transform = `translate(0px, 0px)`;
  input.moveX = 0; input.moveY = 0;
}

let isDragging = false;
base.addEventListener('mousedown', (e) => { isDragging = true; handleJoystickMove(e.clientX, e.clientY); });
window.addEventListener('mousemove', (e) => { if (isDragging) handleJoystickMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; resetJoystick(); } });

base.addEventListener('touchstart', (e) => {
  e.preventDefault(); isDragging = true;
  handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: false});

window.addEventListener('touchmove', (e) => {
  if (isDragging) { e.preventDefault(); handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY); }
}, {passive: false});

window.addEventListener('touchend', () => { if (isDragging) { isDragging = false; resetJoystick(); } });

function setupActionButton(id, keyName) {
  const el = document.getElementById(id);
  if (!el) return;
  const activate = (e) => { e.preventDefault(); input[keyName] = true; el.classList.add('touch-active'); };
  const deactivate = (e) => { e.preventDefault(); input[keyName] = false; el.classList.remove('touch-active'); };
  el.addEventListener('mousedown', activate);
  el.addEventListener('mouseup', deactivate);
  el.addEventListener('mouseleave', deactivate);
  el.addEventListener('touchstart', activate, {passive: false});
  el.addEventListener('touchend', deactivate, {passive: false});
}
setupActionButton('btn-a', 'a');
setupActionButton('btn-b', 'b');

function resetRally() {
  player.x = 192; player.y = 350;
  cpu.x = 192; cpu.y = 110;
  ball.x = 192; ball.y = 330;
  ball.z = 0; ball.vx = 0; ball.vy = 0; ball.vz = 0;
  ball.active = false;
}
resetRally();

function update() {
  let kx = 0, ky = 0;
  if (keys.left) kx = -1;
  if (keys.right) kx = 1;
  if (keys.up) ky = -1;
  if (keys.down) ky = 1;

  let mx = input.moveX !== 0 ? input.moveX : kx;
  let my = input.moveY !== 0 ? input.moveY : ky;

  player.x += mx * player.speed;
  player.y += my * player.speed;

  if (player.x < 55) player.x = 55;
  if (player.x > 329) player.x = 329;
  if (player.y < 235) player.y = 235;
  if (player.y > 395) player.y = 395;

  if (ball.active) {
    if (cpu.x < ball.x - 4) cpu.x += cpu.speed;
    else if (cpu.x > ball.x + 4) cpu.x -= cpu.speed;
  }
  if (cpu.x < 75) cpu.x = 75;
  if (cpu.x > 309) cpu.x = 309;

  if (ball.active) {
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.z += ball.vz;
    ball.vz -= 0.14;

    if (ball.z <= 0) {
      ball.z = 0;
      if (ball.y < 65) {
        scorePlayer++; // プレイヤーの得点
        resetRally();
      } else if (ball.y > 405) {
        scoreCpu++; // CPUの得点
        resetRally();
      }
    }
  }

  if (effect.timer > 0) effect.timer--;

  if (!ball.active && input.a) {
    ball.active = true;
    ball.vx = (Math.random() - 0.5) * 2;
    ball.vy = -4.5;
    ball.vz = 2.2;
    effect = { x: player.x, y: player.y - 15, timer: 15 };
  } else if (ball.active) {
    let distP = Math.hypot(player.x - ball.x, player.y - ball.y);
    if (distP < 35 && ball.y > 210 && ball.y < 390) {
      if (input.a) {
        ball.vy = -5.2; ball.vz = 1.6;
        ball.vx = (ball.x - player.x) * 0.15;
        effect = { x: ball.x, y: ball.y, timer: 15 };
      } else if (input.b) {
        ball.vy = -3.2; ball.vz = 4.8;
        ball.vx = (ball.x - player.x) * 0.1;
        effect = { x: ball.x, y: ball.y, timer: 15 };
      }
    }

    let distC = Math.hypot(cpu.x - ball.x, cpu.y - ball.y);
    if (distC < 35 && ball.y < 220 && ball.y > 60) {
      ball.vy = 5.2; ball.vz = 1.6;
      ball.vx = (ball.x - cpu.x) * 0.15;
    }
  }
}

function draw() {
  ctx.fillStyle = '#008080';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // --- 立体感のあるパースペクティブ（台形）コートの描画 ---
  const tlX = 75, tlY = 65;
  const trX = 309, trY = 65;
  const brX = 345, brY = 405;
  const blX = 39, blY = 405;

  ctx.fillStyle = '#228b22';
  ctx.beginPath();
  ctx.moveTo(blX, blY); ctx.lineTo(tlX, tlY);
  ctx.lineTo(trX, trY); ctx.lineTo(brX, brY);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(192, 65);
  ctx.lineTo(192, 405);
  ctx.stroke();

  let sTopY = 65 + (405 - 65) * 0.35;
  let sTopLeftX = blX + (tlX - blX) * 0.35;
  let sTopRightX = brX + (trX - brX) * 0.35;
  let sBotY = 65 + (405 - 65) * 0.65;
  let sBotLeftX = blX + (tlX - blX) * 0.65;
  let sBotRightX = brX + (trX - brX) * 0.65;

  ctx.beginPath();
  ctx.moveTo(sTopLeftX, sTopY); ctx.lineTo(sTopRightX, sTopY);
  ctx.moveTo(sBotLeftX, sBotY); ctx.lineTo(sBotRightX, sBotY);
  ctx.stroke();

  let netY = 65 + (405 - 65) * 0.5;
  let netLeftX = blX + (tlX - blX) * 0.5 - 12;
  let netRightX = brX + (trX - brX) * 0.5 + 12;

  ctx.fillStyle = '#111';
  ctx.fillRect(netLeftX - 10, netY - 8, (netRightX - netLeftX) + 20, 16);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(netLeftX - 10, netY - 8, (netRightX - netLeftX) + 20, 16);

  // --- スコア表示 ---
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px "Courier New"';
  ctx.fillText(`YOU: ${scorePlayer}`, 45, 25);
  ctx.fillText(`CPU: ${scoreCpu}`, 280, 25);
  ctx.fillText(ball.active ? "ラリー中!" : "サーブは[A]!", 140, 25);

  // --- キャラクターの切り出し描画（IMG_8747.JPG対応） ---
  if (imageLoaded) {
    // スプライトシート全体を10列×9行のグリッドとして正確に1コマ分を計算
    const colWidth = spriteSheet.width / 10;
    const rowHeight = spriteSheet.height / 9;

    // 手前プレイヤー（後ろ向きのコマ：例として 2列目・1行目付近）
    ctx.drawImage(spriteSheet, colWidth * 2, rowHeight * 1, colWidth, rowHeight, player.x - 18, player.y - 26, 36, 36);

    // 奥側CPU（前向きのコマ：例として 0列目・0行目付近）
    ctx.drawImage(spriteSheet, 0, 0, colWidth, rowHeight, cpu.x - 16, cpu.y - 26, 32, 32);
  } else {
    // 画像読込中のフォールバック
    ctx.fillStyle = '#ff69b4'; ctx.fillRect(player.x - 12, player.y - 18, 24, 28);
    ctx.fillStyle = '#00fa9a'; ctx.fillRect(cpu.x - 12, cpu.y - 18, 24, 28);
  }

  // --- ボールと影 ---
  let shadowY = ball.y + ball.z;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.arc(ball.x, shadowY, 4, 0, Math.PI*2); ctx.fill();

  let ballScreenY = ball.y - ball.z;
  ctx.fillStyle = '#ffffe0';
  ctx.beginPath(); ctx.arc(ball.x, ballScreenY, 5, 0, Math.PI*2); ctx.fill();

  // --- 打球エフェクト（IMG_8747.JPG の「右下」のコマを切り出し） ---
  if (effect.timer > 0 && imageLoaded) {
    const colWidth = spriteSheet.width / 10;
    const rowHeight = spriteSheet.height / 9;
    // スプライトシートの右下（9列目・8行目）のエフェクト部分を切り出し
    ctx.drawImage(spriteSheet, colWidth * 9, rowHeight * 8, colWidth, rowHeight, effect.x - 16, effect.y - 16, 32, 32);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
