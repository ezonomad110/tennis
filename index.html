<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Retro Tennis — レトロテニス</title>
<style>
* { box-sizing: border-box; }
html, html, body {
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
canvas { touch-action: none; }
body { height: 100%; }
body {
  margin: 0;
  background: #141428;
  color: #f5f5f5;
  font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  display: flex; justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; overscroll-behavior: none; }
.wrap { max-width: 520px; width: 100%; text-align: center; }
.hidden { display: none !important; }
#menuScreen { padding: 20px 16px 28px; }
.menu-note { font-size: 12px; opacity: .65; line-height: 1.7; margin-top: 14px; }
/* Game screen: exactly one viewport tall, no page scrolling.
   The court area flexes; the canvas letterboxes inside it. */
#gameScreen {
  height: 100dvh;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 8px;
}
.canvasWrap { flex: 1 1 auto; min-height: 0; display: flex; }
.back {
  align-self: center; flex: none;
  background: none; border: 1px solid #3d3d66; color: #9aa;
  border-radius: 8px; padding: 6px 16px; font-size: 12px; cursor: pointer;
}
h1 { margin: 8px 0 0; letter-spacing: 2px; font-size: 28px; }
.sub { opacity: .75; margin: 4px 0 14px; font-size: 13px; }
.selectors { background: #1d1d38; border: 2px solid #3d3d66; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; text-align: left; }
.selectors h2 { font-size: 13px; margin: 8px 0 6px; letter-spacing: 1px; color: #8ecae6; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.btnrow button { background: #16213e; color: #fff; border: 2px solid #3d3d66; border-radius: 8px; padding: 7px 10px; font-size: 13px; cursor: pointer; }
.btnrow button.active { border-color: #ffd166; background: #3a2f10; color: #ffd166; font-weight: 700; }
.info { font-size: 12px; opacity: .85; min-height: 16px; margin: 5px 0 0; }
.apply { width: 100%; margin-top: 10px; background: #e63946; color: #fff; border: none; border-radius: 8px; padding: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
.hud { display: flex; flex-direction: column; gap: 4px; flex: none; }
.scorebox { font-size: 18px; background: #16213e; padding: 8px 12px; border-radius: 8px; }
.scorebox strong { color: #ffd166; font-size: 22px; }
.vs { opacity: .5; margin: 0 8px; }
.message { min-height: 22px; color: #8ecae6; font-weight: 700; }
.chain { min-height: 20px; color: #fb923c; font-weight: 700; font-size: 14px; }
canvas {
  flex: 1 1 auto; min-width: 0; min-height: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  background: #2a9d4a;
  border: 4px solid #f8f8f8; border-radius: 4px;
  image-rendering: pixelated;
  touch-action: none;
}
.controls { font-size: 13px; opacity: .9; line-height: 1.6; }
.hint { opacity: .7; }
.touch { display: none; gap: 10px; justify-content: space-between; align-items: center; flex: none; }
.hudrow { display: flex; gap: 8px; align-items: stretch; }
.hudrow .scorebox { flex: 1; }
.pause {
  flex: none; width: 50px; font-size: 18px; cursor: pointer;
  background: #16213e; color: #fff; border: 2px solid #3d3d66; border-radius: 8px;
}
/* Super Famicom-style diamond pad:  X (top) / Y (left) / A (right) / B (bottom).
   Button colours match the ball colours of each shot type. */
.pad {
  display: grid; flex: none;
  grid-template-columns: repeat(3, 58px);
  grid-template-rows: repeat(3, 58px);
  gap: 4px;
}
.pad-btn {
  border-radius: 50%; border: 2px solid rgba(0,0,0,.35);
  font-size: 12px; font-weight: 700; line-height: 1.25; cursor: pointer;
  display: flex; align-items: center; justify-content: center; text-align: center;
}
.pad-btn:active { filter: brightness(0.85); }
.pos-x { grid-column: 2; grid-row: 1; }
.pos-y { grid-column: 1; grid-row: 2; }
.pos-a { grid-column: 3; grid-row: 2; }
.pos-b { grid-column: 2; grid-row: 3; }
.c-spin  { background: #d9f99d; color: #1a2e05; }
.c-slice { background: #f8fafc; color: #111827; }
.c-lob   { background: #fdba74; color: #431407; }
.c-drop  { background: #7dd3fc; color: #082f49; }
.stick {
  position: relative; flex: 0 0 auto;
  width: 128px; height: 128px; border-radius: 50%;
  background: rgba(255,255,255,.06); border: 2px solid #3d3d66;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.stick::before { content: "＋"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.18); font-size: 34px; }
.stick-knob {
  position: absolute; left: 50%; top: 50%;
  width: 56px; height: 56px; border-radius: 50%;
  background: #3d3d66; border: 2px solid #8ecae6;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
@media (pointer: coarse), (max-width: 640px) { .touch { display: flex; } }

/* ===== Luminous theme: neon colours, glow everywhere. Gameplay unchanged. ===== */
body.neon {
  background: radial-gradient(1200px 800px at 50% -10%, #2b1065 0%, #0b0620 55%, #05010f 100%);
  background-size: 150% 150%;
  animation: neonBg 14s ease-in-out infinite alternate;
  color: #e0f2fe;
}
@keyframes neonBg {
  from { background-position: 0% 0%; }
  to { background-position: 100% 60%; }
}
body.neon h1 {
  background: linear-gradient(90deg, #22d3ee, #a78bfa, #f472b6);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 14px rgba(167,139,250,.45));
}
body.neon .sub { color: #a5b4fc; }
body.neon .info { color: #a5f3fc; }
body.neon .menu-note { color: #c4b5fd; }
body.neon .scorebox {
  background: rgba(10,6,32,.88); border: 1px solid #22d3ee; color: #e0f2fe;
  box-shadow: 0 0 14px rgba(34,211,238,.55), inset 0 0 12px rgba(34,211,238,.15);
}
body.neon .scorebox strong { color: #fde047; text-shadow: 0 0 8px rgba(253,224,71,.85); }
body.neon .message { color: #a5f3fc; text-shadow: 0 0 10px rgba(34,211,238,.85); }
body.neon .chain {
  color: #fff; font-size: 17px;
  text-shadow: 0 0 6px #f59e0b, 0 0 16px #f97316, 0 0 30px #ef4444;
}
body.neon .chain.pop { animation: chainPop .38s ease-out; }
@keyframes chainPop {
  0% { transform: scale(1); }
  35% { transform: scale(1.45) rotate(-2deg); }
  100% { transform: scale(1); }
}
body.neon canvas {
  border-color: #22d3ee;
  box-shadow: 0 0 22px rgba(34,211,238,.5), 0 0 64px rgba(167,139,250,.28);
}
body.neon .btnrow button {
  background: #12082e; color: #e0f2fe; border: 1px solid #7c3aed;
  box-shadow: 0 0 8px rgba(124,58,237,.35);
}
body.neon .btnrow button.active {
  background: linear-gradient(90deg, #0891b2, #7c3aed, #db2777); color: #fff;
  border-color: transparent; box-shadow: 0 0 16px rgba(219,39,119,.6);
}
body.neon .apply {
  background: linear-gradient(90deg, #06b6d4, #d946ef); color: #fff;
  box-shadow: 0 0 20px rgba(217,70,239,.55);
}
body.neon .pause {
  background: #12082e; border-color: #22d3ee; color: #fff;
  box-shadow: 0 0 10px rgba(34,211,238,.5);
}
body.neon .back { background: #12082e; color: #a5f3fc; border: 1px solid #7c3aed; }
body.neon .stick {
  border-color: #22d3ee; background: rgba(8,4,24,.6);
  box-shadow: 0 0 16px rgba(34,211,238,.45), inset 0 0 18px rgba(34,211,238,.2);
}
body.neon .stick-knob {
  background: radial-gradient(circle at 35% 35%, #a5f3fc, #0891b2 60%, #155e75);
  border-color: #a5f3fc; box-shadow: 0 0 14px rgba(34,211,238,.8);
}
body.neon .c-spin  { background: #a3e635; color: #1a2e05; border-color: #ecfccb; box-shadow: 0 0 18px #a3e635, 0 0 44px rgba(163,230,53,.5); }
body.neon .c-slice { background: #f0f9ff; color: #082f49; border-color: #ffffff; box-shadow: 0 0 18px #7dd3fc, 0 0 44px rgba(125,211,252,.5); }
body.neon .c-lob   { background: #fb923c; color: #431407; border-color: #ffedd5; box-shadow: 0 0 18px #fb923c, 0 0 44px rgba(251,146,60,.5); }
body.neon .c-drop  { background: #38bdf8; color: #082f49; border-color: #e0f2fe; box-shadow: 0 0 18px #38bdf8, 0 0 44px rgba(56,189,248,.55); }

body.neon .scorebox strong.scorepop { display: inline-block; animation: scorePop .45s ease-out; }
@keyframes scorePop {
  0% { transform: scale(1); }
  40% { transform: scale(1.9); }
  100% { transform: scale(1); }
}

body.neon canvas { background: #05010f; }

</style>
<script>
window.addEventListener('error', function (e) {
  var m = document.getElementById('message');
  if (m && !window.__gameStarted) m.textContent = '読み込みエラー: ' + e.message + '（ページを再読み込みしてください）';
});
</script>
</head>
<body>
  <main class="wrap">

    <!-- ===== Menu screen: choose player & court ===== -->
    <div id="menuScreen" class="screen">
      <h1>🎾 RETRO TENNIS</h1>
      <p class="sub">ファミコン時代のテニスゲームへのオマージュ — オリジナル作品です</p>

      <section class="selectors">
        <div>
          <h2>モードを選ぶ</h2>
          <div id="modeSelect" class="btnrow"></div>
          <p id="modeInfo" class="info"></p>
        </div>
        <div>
          <h2>テーマを選ぶ</h2>
          <div id="themeSelect" class="btnrow"></div>
          <p id="themeInfo" class="info"></p>
        </div>
        <div>
          <h2>選手を選ぶ</h2>
          <div id="charSelect" class="btnrow"></div>
          <p id="charInfo" class="info"></p>
        </div>
        <div>
          <h2>コートを選ぶ</h2>
          <div id="courtSelect" class="btnrow"></div>
          <p id="courtInfo" class="info"></p>
        </div>
        <button id="btnStart" class="apply">▶ ゲームスタート</button>
      </section>

      <p class="menu-note">ラリーで同じ球種が続くほどチェーンが伸びて球が速くなります（両プレイヤー共通）。スピン⇔スライスに切り替わると切れますが、ロブとドロップはワイルドカードで切れません。</p>
    </div>

    <!-- ===== Game screen: fixed to one screen, no scrolling ===== -->
    <div id="gameScreen" class="screen hidden">
      <div class="hud">
        <div class="hudrow">
          <div class="scorebox">
            <span><span id="playerName">YOU</span> <strong id="playerGames">0</strong> — <span id="playerPoints">0</span></span>
            <span class="vs">|</span>
            <span>CPU <strong id="cpuGames">0</strong> — <span id="cpuPoints">0</span></span>
          </div>
          <button id="btnPause" class="pause" aria-label="一時停止">⏸</button>
        </div>
        <div id="message" class="message">SPACE でサーブ！</div>
        <div id="chain" class="chain"></div>
      </div>

      <div class="canvasWrap">
        <canvas id="game" width="480" height="560"></canvas>
      </div>

      <div class="touch">
        <div id="stick" class="stick" aria-label="仮想スティック"><div id="stickKnob" class="stick-knob"></div></div>
        <div class="pad" aria-label="ショットボタン">
          <button id="btnSliceX" class="pad-btn pos-x c-slice">X<br>スライス</button>
          <button id="btnLob" class="pad-btn pos-y c-lob">Y<br>ロブ</button>
          <button id="btnSpinA" class="pad-btn pos-a c-spin">A<br>スピン</button>
          <button id="btnDrop" class="pad-btn pos-b c-drop">B<br>ドロップ</button>
        </div>
      </div>

      <button id="btnBack" class="back">← メニューに戻る</button>
    </div>

  </main>
  <script>
// Retro Tennis v2 — original homage to Famicom-era tennis games.
// Hallmarks recreated as original mechanics: stat-rated players (A/B/C),
// 4 court surfaces with different bounces, spin shots (topspin/slice/lob),
// volleys & smashes, chibi 3-head-tall pixel players.
// No assets, code, music, names or characters from any commercial game are used.
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const NET_Y = 280;
const WIN_GAMES = 3;

// ---------- Characters (all original) ----------
const STAT = { A: 3, B: 2, C: 1 };
const CHARACTERS = [
  { id: "gou",   name: "ゴウ",   serve: "A", stroke: "A", volley: "C", footwork: "B", racket: 0,  color: "#dc2626", cap: "#7f1d1d", skin: "#f2c894", hair: "cap", desc: "パワー型。サーブとストロークが強烈、ボレーは苦手。" },
  { id: "ken",   name: "ケン",   serve: "B", stroke: "B", volley: "B", footwork: "B", racket: 0,  color: "#2563eb", cap: "#1e3a8a", skin: "#ffd9b3", hair: "cap", desc: "バランス型。穴がなく扱いやすい。" },
  { id: "saki",  name: "サキ",   serve: "C", stroke: "B", volley: "B", footwork: "B", racket: 10, color: "#db2777", cap: "#9d2449", skin: "#ffe3c7", hair: "ponytail", desc: "大きなラケットで当たりやすい、初心者向け。サーブは控えめ。" },
  { id: "hayato",name: "ハヤト", serve: "C", stroke: "B", volley: "A", footwork: "A", racket: 0,  color: "#16a34a", cap: "#14532d", skin: "#eab883", hair: "band", band: "#facc15", desc: "俊足＋ボレーの達人。ネットプレーで攻める。" },
];
let selectedChar = CHARACTERS[1];
let selectedCharIdx = 1;
// Game mode: "singles" (1v1) or "doubles" (you + AI partner vs a CPU pair).
const MODES = [
  { id: "singles", name: "シングルス", desc: "1対1の通常モード。" },
  { id: "doubles", name: "ダブルス", desc: "AIパートナーと組んで2対2。コートが広く（アレー内も有効）、サーブは4人ローテーション。" },
];
let mode = "singles";
// Visual theme: "retro" (classic) or "neon" (Luminous). Theme changes
// only how things look — controls, rules and physics are identical.
const THEMES = [
  { id: "retro", name: "レトロ", desc: "ファミコン風のクラシックな見た目。" },
  { id: "neon", name: "ルミナス", desc: "ネオンカラーでド派手に光る見た目。チェーン表示も大きく弾けます。操作・ルールは同じ。" },
];
let theme = "retro";
function applyTheme() { document.body.classList.toggle("neon", theme === "neon"); }

// ---------- Courts (all original settings, inspired by era conventions) ----------
const COURTS = {
  hard:  { name: "HARD",  desc: "屋内ハード。クセがなく平均的。", peak: 1.0, bounce: 0.55, afterBounce: 0.92, speed: 1.00, inside: "#3a7bd5", inside2: "#356fc0", outside: "#2e7d5b", dust: "#dbeafe" },
  lawn:  { name: "LAWN",  desc: "芝。バウンドが低く、バウンド後も速い。", peak: 0.8, bounce: 0.36, afterBounce: 1.00, speed: 1.08, inside: "#3f9e4d", inside2: "#358a42", outside: "#2c7a38", dust: "#dcfce7" },
  clay:  { name: "CLAY",  desc: "土。バウンド後に大きく減速、ラリーが長くなる。", peak: 1.1, bounce: 0.60, afterBounce: 0.66, speed: 0.93, inside: "#c46a3a", inside2: "#b45f33", outside: "#6b7f4e", dust: "#f2b183" },
  cosmo: { name: "COSMO", desc: "宇宙コート。高く弾んで少しフワフワ。", peak: 1.6, bounce: 0.88, afterBounce: 0.95, speed: 1.00, inside: "#5b4b9e", inside2: "#50428c", outside: "#171233", dust: "#ddd6fe" },
};
let court = COURTS.hard;

// ---------- Selection UI ----------
function buildSelect(elId, items, getLabel, onPick, initialIdx) {
  const el = document.getElementById(elId);
  items.forEach((item, i) => {
    const b = document.createElement("button");
    b.textContent = getLabel(item);
    if (i === initialIdx) b.classList.add("active");
    b.addEventListener("click", () => {
      el.querySelectorAll("button").forEach(x => x.classList.remove("active"));
      b.classList.add("active"); onPick(item);
    });
    el.appendChild(b);
  });
}
function refreshInfo() {
  const c = selectedChar;
  document.getElementById("charInfo").textContent =
    `${c.name}：サーブ${c.serve} / ストローク${c.stroke} / ボレー${c.volley} / フットワーク${c.footwork}${c.racket ? " / 大きなラケット" : ""} — ${c.desc}`;
  document.getElementById("courtInfo").textContent = `${court.name} — ${court.desc}`;
  document.getElementById("playerName").textContent = c.name;
}
buildSelect("charSelect", CHARACTERS, c => c.name, c => { selectedChar = c; selectedCharIdx = CHARACTERS.indexOf(c); applyChar(); refreshInfo(); }, 1);
buildSelect("modeSelect", MODES, m => m.name, m => { mode = m.id; document.getElementById("modeInfo").textContent = m.desc; }, 0);
buildSelect("themeSelect", THEMES, t => t.name, t => { theme = t.id; applyTheme(); document.getElementById("themeInfo").textContent = t.desc; }, 0);
buildSelect("courtSelect", Object.values(COURTS), c => c.name, c => { court = c; refreshInfo(); }, 0);
// ---------- Screens: menu (player/court select) -> game ----------
let appScreen = "menu";
function showGame() {
  appScreen = "game";
  document.getElementById("menuScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  document.body.classList.add("locked");
  window.scrollTo(0, 0);
  applyChar(); resetMatch();
}
function showMenu() {
  setPaused(false);
  appScreen = "menu";
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("menuScreen").classList.remove("hidden");
  document.body.classList.remove("locked");
  window.scrollTo(0, 0);
}
document.getElementById("btnStart").addEventListener("click", showGame);
document.getElementById("btnBack").addEventListener("click", showMenu);

// ---------- Court geometry ----------
function lerp(a, b, t) { return a + (b - a) * t; }
function courtEdge(y) {
  const t = Math.max(0, Math.min(1, (y - 70) / (490 - 70)));
  return { left: lerp(110, 40, t), right: lerp(370, 440, t), t };
}
function singlesBounds(y) {
  const e = courtEdge(y); const inset = lerp(18, 28, e.t);
  return { left: e.left + inset, right: e.right - inset };
}
// Doubles plays to the outer (doubles) lines: the alleys are in.
function doublesBounds(y) { const e = courtEdge(y); return { left: e.left, right: e.right }; }
function activeBounds(y) { return mode === "doubles" ? doublesBounds(y) : singlesBounds(y); }
// Keep every aimed shot inside the (narrower-at-the-far-end) court.
function clampTargetX(x, y) {
  const b = activeBounds(y);
  return Math.max(b.left + 14, Math.min(b.right - 14, x));
}
function inCourt(x, y) {
  if (y < 66 || y > 494) return false;
  const b = activeBounds(y);
  return x >= b.left - 4 && x <= b.right + 4;
}
function inServiceBox(x, y, forPlayerServe) {
  // A serve must land between the service line and the net (a "long" serve is a fault),
  // in the box DIAGONALLY opposite the server: deuce point = server's right side,
  // which on screen is top-LEFT for the bottom player and bottom-RIGHT for the top CPU.
  if (forPlayerServe) { if (y < 169 || y > NET_Y) return false; }
  else { if (y < NET_Y || y > 391) return false; }
  const b = activeBounds(y); const mid = (b.left + b.right) / 2;
  const deuce = (rawPoints[0] + rawPoints[1]) % 2 === 0;
  if (forPlayerServe) return deuce ? (x >= b.left - 4 && x <= mid + 4) : (x >= mid - 4 && x <= b.right + 4);
  return deuce ? (x >= mid - 4 && x <= b.right + 4) : (x >= b.left - 4 && x <= mid + 4);
}
function serveFault() {
  if (faults >= 1) { awardPoint(server === "player" ? "cpu" : "player", "ダブルフォルト…"); }
  else {
    faults = 1; pendingSecondServe = true; state = "pointEnd"; pointTimer = 60; ball.dead = true;
    setMessage("フォルト！ セカンドサーブへ");
  }
}

// ---------- Audio (original square-wave jingles) ----------
let audioCtx = null;
function beep(freq, dur = 0.06, vol = 0.05, delay = 0) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) {}
}
function jingle(win) {
  const notes = win ? [523, 659, 784, 1046] : [392, 330, 262, 196];
  notes.forEach((n, i) => beep(n, 0.11, 0.05, i * 0.11));
}

// ---------- Input: A=topspin, B=slice, C=lob (Famicom-style buttons) ----------
const keys = {};
let queuedShot = "top";
addEventListener("keydown", (e) => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)) e.preventDefault();
  if (keys[e.code]) return; keys[e.code] = true;
  if (e.code === "Space" || e.code === "KeyZ") onSwing("top");
  if (e.code === "KeyX") onSwing("slice");
  if (e.code === "KeyC") onSwing("lob");
  if (e.code === "KeyV" || e.code === "KeyB") onSwing("drop");
  if (e.code === "KeyR") { applyChar(); resetMatch(); }
  if (e.code === "KeyP") togglePause();
});

  const BODY = [".ATTTTTTTTTTA.", ".ATTTTTTTTTTA.", "..TTTTTTTTTT..", "..TTTTTTTTTT..", "..WWWWWWWWWW..", "..WWWWWWWWWW.."];
  const rows = (isPlayer ? HEAD_BACK : HEAD_FRONT).concat(BODY);
  const pal = { C: p.cap, S: skin, T: p.color, A: skin, W: "#f8fafc", E: "#1f2937" };
  const top = y - 12 * u;
  rows.forEach((row, ri) => {
    for (let ci = 0; ci < row.length; ci++) {
      const ch = row[ci];
      if (ch === ".") continue;
      let col = pal[ch];
      if (ch === "C" && p.hair === "band" && ri === 2) col = p.band || "#facc15"; // headband row
      ctx.fillStyle = col;
      ctx.fillRect(x - 7 * u + ci * u, top + ri * u, u + 0.5, u + 0.5);
    }
  });
  // Ponytail (Saki): hangs down the back, or at the side from the front
  if (p.hair === "ponytail") {
    ctx.fillStyle = p.cap;
    if (isPlayer) ctx.fillRect(x - u, top + 3 * u, 2 * u, 5 * u);
    else ctx.fillRect(x - 8 * u, top + 3 * u, 2 * u, 5 * u);
  }
  // Racket arm: sweeps through the swing instead of just lifting.
  const sideSign = isPlayer ? 1 : -1;
  let th = -0.8; // idle: racket up and out
  if (p.swing > 0) { const q = 1 - p.swing / 8; th = -2.3 + 2.8 * q; }
  if (!isPlayer) th = Math.PI - th; // CPU faces the other way (mirrored)
  const sx = x + sideSign * 5.2 * u, sy = y - 4.5 * u;
  const hx = sx + Math.cos(th) * 3.2 * u, hy = sy + Math.sin(th) * 3.2 * u;
  ctx.strokeStyle = skin; ctx.lineWidth = 1.9 * u; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();
  const rx = hx + Math.cos(th) * 5.2 * u, ry = hy + Math.sin(th) * 5.2 * u;
  if (theme === "neon") {
    // Lightsaber (Luminous only): your side burns blue, the CPU side red.
    // The blade always glows; swinging leaves a swoosh of afterimages.
    const saber = isPlayer ? "#38bdf8" : "#ef4444";
    const saberPale = isPlayer ? "#bae6fd" : "#fecaca";
    const dx = Math.cos(th), dy = Math.sin(th);
    const bx = hx + dx * 1.2 * u, by = hy + dy * 1.2 * u;   // blade base
    const txp = hx + dx * 10.6 * u, typ = hy + dy * 10.6 * u; // blade tip
    if (!p.saberTrail) p.saberTrail = [];
    p.saberTrail = p.saberTrail.filter(sp => (sp.t += DT) < 9);
    if (p.swing > 0) p.saberTrail.push({ bx, by, tx: txp, ty: typ, t: 0 });
    ctx.save(); ctx.lineCap = "round";
    p.saberTrail.forEach(sp => { // swing afterimages, oldest = faintest
      const k = 1 - sp.t / 9;
      ctx.globalAlpha = k * 0.45;
      ctx.strokeStyle = saber; ctx.shadowColor = saber; ctx.shadowBlur = 10;
      ctx.lineWidth = (1.5 + 5 * k) * u;
      ctx.beginPath(); ctx.moveTo(sp.bx, sp.by); ctx.lineTo(sp.tx, sp.ty); ctx.stroke();
      ctx.globalAlpha = k * 0.5; ctx.strokeStyle = "#ffffff"; ctx.shadowBlur = 0;
      ctx.lineWidth = 1.4 * u;
      ctx.beginPath(); ctx.moveTo(sp.bx, sp.by); ctx.lineTo(sp.tx, sp.ty); ctx.stroke();
    });
    ctx.globalAlpha = 1;
    // Hilt: dark grip with a silver band
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#1f2937"; ctx.lineWidth = 2.3 * u;
    ctx.beginPath(); ctx.moveTo(hx - dx * 0.6 * u, hy - dy * 0.6 * u); ctx.lineTo(bx, by); ctx.stroke();
    ctx.strokeStyle = "#d1d5db"; ctx.lineWidth = 2.4 * u;
    ctx.beginPath(); ctx.moveTo(hx + dx * 0.45 * u, hy + dy * 0.45 * u); ctx.lineTo(hx + dx * 0.85 * u, hy + dy * 0.85 * u); ctx.stroke();
    // Blade: coloured glow, pale mid, white core — with a faint hum flicker
    const flick = 0.9 + 0.1 * Math.sin(frameCount * 0.9 + p.x);
    ctx.strokeStyle = saber; ctx.shadowColor = saber;
    ctx.shadowBlur = (p.swing > 0 ? 20 : 14) * flick;
    ctx.globalAlpha = 0.9; ctx.lineWidth = 5.2 * u;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(txp, typ); ctx.stroke();
    ctx.strokeStyle = saberPale; ctx.shadowBlur = 8;
    ctx.globalAlpha = 0.95; ctx.lineWidth = 2.9 * u;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(txp, typ); ctx.stroke();
    ctx.strokeStyle = "#ffffff"; ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    ctx.lineWidth = 1.6 * u;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(txp, typ); ctx.stroke();
    ctx.restore();
    return;
  }
  ctx.strokeStyle = "#92400e"; ctx.lineWidth = 1.2 * u;
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(rx - Math.cos(th) * 3.4 * u, ry - Math.sin(th) * 3.4 * u); ctx.stroke();
  ctx.save(); ctx.translate(rx, ry); ctx.rotate(th);
  ctx.strokeStyle = "#e5e7eb"; ctx.lineWidth = Math.max(1.6, 0.85 * u);
  ctx.beginPath(); ctx.ellipse(0, 0, 4.6 * u, 3.3 * u, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 1; // strings
  ctx.beginPath();
  [-1.4, 0, 1.4].forEach(o => { ctx.moveTo(o * u, -2.3 * u); ctx.lineTo(o * u, 2.3 * u); });
  [-1.15, 1.15].forEach(o => { ctx.moveTo(-3.2 * u, o * u); ctx.lineTo(3.2 * u, o * u); });
  ctx.stroke();
  ctx.restore();
}
function drawBall() {
  const scale = 0.65 + (ball.y / H) * 0.6;
  const neonBall = theme === "neon";
  if (!neonBall) {
    ball.trail.slice(-7).forEach((t, i) => {
      ctx.fillStyle = `rgba(255,255,255,${0.05 + i * 0.02})`;
      ctx.beginPath(); ctx.arc(t.x, t.y, 4 * scale, 0, Math.PI * 2); ctx.fill();
    });
  } else {
    // Ribbon trail: thin cyan when calm, purple/pink as the chain builds,
    // rainbow at the highest heat. Length, width and glow all grow.
    const tier = heatTier();
    const n = Math.min(ball.trail.length, 16 + rallyChain.count * 4, 64);
    const raw = ball.trail.slice(-n);
    const pts = [];
    raw.forEach((p, i) => {
      if (i) { const q = raw[i - 1]; pts.push({ x: (q.x + p.x) / 2, y: (q.y + p.y) / 2 }); }
      pts.push(p);
    });
    const maxW = [2.6, 4.2, 6, 7.5][tier];
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.shadowBlur = [8, 14, 20, 26][tier];
    for (let i = 1; i < pts.length; i++) {
      const pr = i / (pts.length - 1 || 1);
      const col = heatColor(tier, pr);
      ctx.strokeStyle = col; ctx.shadowColor = col;
      ctx.globalAlpha = 0.2 + pr * 0.85;
      ctx.lineWidth = 0.6 + pr * maxW;
      ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
    }
    if (tier >= 2) { // bright core line inside the ribbon
      ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.5; ctx.lineWidth = 1.2;
      ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  if (neonBall && !ball.dead) {
    const tier = heatTier();
    const bx = ball.x, by = ball.y - ball.z;
    const gr = 22 + tier * 8;
    const hg = ctx.createRadialGradient(bx, by, 0, bx, by, gr);
    hg.addColorStop(0, hexA(ballColor(), 0.5)); hg.addColorStop(1, hexA(ballColor(), 0));
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(bx, by, gr, 0, Math.PI * 2); ctx.fill();
    if (tier >= 2) { // ghost afterimages trailing the ball
      [6, 12, 18, 24].forEach((off, gi) => {
        if (tier === 2 && gi > 2) return;
        const gp = ball.trail[ball.trail.length - 1 - off];
        if (!gp) return;
        ctx.save();
        ctx.globalAlpha = [0.24, 0.16, 0.1, 0.06][gi];
        ctx.fillStyle = ballColor(); ctx.shadowColor = ballColor(); ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(gp.x, gp.y, (6 * scale) * (gi ? 0.8 : 0.92), 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });
    }
  }
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.beginPath(); ctx.ellipse(ball.x, ball.y + 4, 7 * scale, 3 * scale, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = ballColor();
  ctx.beginPath(); ctx.arc(ball.x, ball.y - ball.z, 6 * scale + ball.z * 0.04, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
  if (neonBall) { // glowing core
    ctx.save();
    ctx.shadowColor = ballColor(); ctx.shadowBlur = 14 + heatTier() * 6;
    ctx.fillStyle = ballColor();
    ctx.beginPath(); ctx.arc(ball.x, ball.y - ball.z, 6 * scale + ball.z * 0.04, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.beginPath(); ctx.arc(ball.x, ball.y - ball.z, (6 * scale + ball.z * 0.04) * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}
function drawLandingMarker() {
  if (state !== "rally" || ball.dead || ball.bounces > 0) return;
  if (ball.landX === null || ball.landY < NET_Y) return; // only for balls coming at the player
  const pulse = 8 + Math.sin(frameCount / 6) * 2.5;
  ctx.strokeStyle = theme === "neon" ? "rgba(103,232,249,.95)" : "rgba(255,255,255,.9)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(ball.landX, ball.landY, pulse + 5, (pulse + 5) * 0.45, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ball.landX - 5, ball.landY - 3); ctx.lineTo(ball.landX + 5, ball.landY + 3);
  ctx.moveTo(ball.landX + 5, ball.landY - 3); ctx.lineTo(ball.landX - 5, ball.landY + 3); ctx.stroke();
}
function frame(timestamp) {
  frameCount++;
  if (theme === "neon" && frameCount % 9 === 0 && particles.length < 130) {
    particles.push({ x: Math.random() * W, y: H - Math.random() * 120, vx: (Math.random() - .5) * 0.3, vy: -0.25 - Math.random() * 0.3, life: 90, color: Math.random() < 0.5 ? "#67e8f9" : "#f0abfc" });
  }
  if (timestamp && lastFrameTime) DT = Math.min(2.5, Math.max(0.2, (timestamp - lastFrameTime) / 16.667));
  if (timestamp) lastFrameTime = timestamp;
  if (appScreen !== "game") { requestAnimationFrame(frame); return; } // menu open: game is paused
  if (!paused) update();
  drawCourt();
  if (theme === "neon") {
    ghostTrails = ghostTrails.filter(gt => (gt.t += DT) < 30);
    ghostTrails.forEach(gt => {
      ctx.save();
      ctx.globalAlpha = (1 - gt.t / 30) * 0.35;
      ctx.strokeStyle = gt.color; ctx.shadowColor = gt.color; ctx.shadowBlur = 8;
      ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.beginPath();
      gt.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.stroke();
      ctx.restore();
    });
  }
  drawLandingMarker();
  particles.forEach(pt => {
    if (theme === "neon") {
      ctx.save(); ctx.fillStyle = pt.color; ctx.shadowColor = pt.color; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.2, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    } else { ctx.fillStyle = pt.color; ctx.fillRect(pt.x, pt.y, 3, 3); }
  });
  if (theme === "neon") {
    rings = rings.filter(r => (r.t += DT) < 20);
    rings.forEach(r => {
      if (r.t < 0) return;
      const p = r.t / 20, rad = 4 + p * (r.big ? 68 : 44);
      ctx.save();
      if (p < 0.45) { // impact flash disc
        ctx.globalAlpha = (1 - p / 0.45) * 0.4;
        ctx.fillStyle = r.color; ctx.shadowColor = r.color; ctx.shadowBlur = 18;
        ctx.beginPath(); ctx.ellipse(r.x, r.y, rad * 0.55, rad * 0.24, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = (1 - p) * 0.9;
      ctx.strokeStyle = r.color; ctx.shadowColor = r.color; ctx.shadowBlur = 14;
      ctx.lineWidth = 3 * (1 - p) + 0.6;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, rad, rad * 0.42, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    });
  }
  const drawList = mode === "doubles" ? [cpu, cpu2, partner, player] : [cpu, player];
  drawList.slice().sort((a, b) => a.y - b.y).forEach(e => drawCharacter(e, e === player || e === partner));
  if (state !== "matchEnd") drawBall();
  ctx.font = "bold 15px monospace"; ctx.textAlign = "center";
  floaters.forEach(f => {
    if (theme === "neon") { ctx.save(); ctx.shadowColor = f.color; ctx.shadowBlur = 10; }
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
    if (theme === "neon") ctx.restore();
  });
  if (bigFx) {
    bigFx.t += DT;
    const p = bigFx.t / 50;
    if (p >= 1) bigFx = null;
    else {
      const pop = p < 0.22 ? 0.4 + 0.69 * (p / 0.22) : 1.09 - 0.09 * Math.min(1, (p - 0.22) / 0.2);
      const alpha = p > 0.65 ? 1 - (p - 0.65) / 0.35 : 1;
      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.textAlign = "center";
      ctx.font = "bold " + Math.round(bigFx.size * pop) + "px monospace";
      const y0 = bigFx.y || 205;
      ctx.shadowColor = bigFx.color; ctx.shadowBlur = 26;
      ctx.fillStyle = bigFx.color;
      ctx.fillText(bigFx.text, W / 2, y0);
      ctx.shadowBlur = 0; ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.fillText(bigFx.text, W / 2, y0);
      if (bigFx.sub) {
        ctx.font = "bold " + Math.round(bigFx.size * 0.48 * pop) + "px monospace";
        ctx.shadowColor = bigFx.color; ctx.shadowBlur = 16;
        ctx.fillStyle = bigFx.color;
        ctx.fillText(bigFx.sub, W / 2, y0 + Math.round(bigFx.size * 0.95));
      }
      ctx.restore();
    }
  }
  if (flashFx) {
    flashFx.t += DT;
    const p = flashFx.t / 22;
    if (p >= 1) flashFx = null;
    else {
      ctx.save();
      ctx.globalAlpha = (1 - p) * 0.75;
      ctx.strokeStyle = flashFx.color; ctx.shadowColor = flashFx.color; ctx.shadowBlur = 22;
      ctx.lineWidth = 5; ctx.strokeRect(3, 3, W - 6, H - 6);
      ctx.restore();
    }
  }
  if (paused) {
    ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 30px monospace"; ctx.textAlign = "center";
    ctx.fillText("⏸ PAUSE", W / 2, H / 2);
  }
  requestAnimationFrame(frame);
}

document.getElementById("modeInfo").textContent = MODES[0].desc;
document.getElementById("themeInfo").textContent = THEMES[0].desc;
applyChar(); refreshInfo(); resetMatch(); frame();
window.__gameStarted = true;

</script>
