<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Tennis Game</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    h2 {
      margin: 2px 0;
      font-size: 16px;
      letter-spacing: 2px;
    }
    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #008080;
      border: 3px solid #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      padding: 6px;
      width: 100vw;
      max-width: 420px;
      box-sizing: border-box;
    }
    canvas {
      background-color: #008080;
      display: block;
      width: 100%;
      height: auto;
      max-height: 52vh;
    }
    /* ファミコン風コントローラー（大きく改良） */
    .controller {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 8px;
      background-color: #b0b0b0;
      border: 3px solid #333;
      padding: 12px 20px;
      box-sizing: border-box;
      border-radius: 6px;
    }
    .d-pad {
      position: relative;
      width: 110px;
      height: 110px;
    }
    .btn-d {
      position: absolute;
      background-color: #222;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border-radius: 4px;
    }
    .btn-d:active, .btn-d.touch-active {
      background-color: #555;
    }
    #btn-up    { top: 0; left: 36px; width: 38px; height: 38px; }
    #btn-down  { bottom: 0; left: 36px; width: 38px; height: 38px; }
    #btn-left  { top: 36px; left: 0; width: 38px; height: 38px; }
    #btn-right { top: 36px; right: 0; width: 38px; height: 38px; }
    .d-center  { top: 36px; left: 36px; width: 38px; height: 38px; background: #222; position: absolute; border-radius: 2px; }

    .action-buttons {
      display: flex;
      gap: 20px;
    }
    .btn-action-container {
      text-align: center;
    }
    .btn-action {
      width: 55px;
      height: 55px;
      background-color: #cc1111;
      color: #fff;
      border: 3px solid #7f1d1d;
      border-radius: 50%;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 5px 0 #7f1d1d;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-action:active, .btn-action.touch-active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #7f1d1d;
    }
  </style>
</head>
<body>

  <h2>RETRO TENNIS</h2>
  
  <div id="game-container">
    <canvas id="gameCanvas" width="384" height="432"></canvas>
    
    <!-- 改良版ファミコン風コントローラー -->
    <div class="controller">
      <div class="d-pad" id="dpad">
        <button class="btn-d" id="btn-up">▲</button>
        <button class="btn-d" id="btn-down">▼</button>
        <button class="btn-d" id="btn-left">◀</button>
        <button class="btn-d" id="btn-right">▶</button>
        <div class="d-center"></div>
      </div>
      <div class="action-buttons">
        <div class="btn-action-container">
          <button class="btn-action" id="btn-b">B</button>
          <span style="font-size:11px; color:#222; font-weight:bold;">ロブ</span>
        </div>
        <div class="btn-action-container">
          <button class="btn-action" id="btn-a">A</button>
          <span style="font-size:11px; color:#222; font-weight:bold;">ショット</span>
        </div>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 画像読み込み
const spriteSheet = new Image();
spriteSheet.src = 'IMG_8747.JPG';
let imageLoaded = false;
spriteSheet.onload = () => { imageLoaded = true; };

// ゲーム状態
let scorePlayer = 0;
let scoreCpu = 0;

const player = { x: 192, y: 360, speed: 3.5 };
const cpu = { x: 192, y: 90, speed: 2.2 };
const ball = { x: 192, y: 230, z: 0, vx: 0, vy: 0, vz: 0, active: false };

// 入力管理（押しっぱなし対応）
const input = { up: false, down: false, left: false, right: false, a: false, b: false };

// キーボード対応
window.addEventListener('keydown', e => {
  if (e.code === 'ArrowUp') input.up = true;
  if (e.code === 'ArrowDown') input.down = true;
  if (e.code === 'ArrowLeft') input.left = true;
  if (e.code === 'ArrowRight') input.right = true;
  if (e.code === 'KeyZ' || e.code === 'Space') input.a = true;
  if (e.code === 'KeyX') input.b = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowUp') input.up = false;
  if (e.code === 'ArrowDown') input.down = false;
  if (e.code === 'ArrowLeft') input.left = false;
  if (e.code === 'ArrowRight') input.right = false;
  if (e.code === 'KeyZ' || e.code === 'Space') input.a = false;
  if (e.code === 'KeyX') input.b = false;
});

// タッチ操作（押しっぱなし＆マルチタッチ・スライド対応）
function setupButton(id, keyName) {
  const el = document.getElementById(id);
  if (!el) return;

  const activate = (e) => {
    e.preventDefault();
    input[keyName] = true;
    el.classList.add('touch-active');
  };
  const deactivate = (e) => {
    e.preventDefault();
    input[keyName] = false;
    el.classList.remove('touch-active');
  };

  el.addEventListener('mousedown', activate);
  el.addEventListener('mouseup', deactivate);
  el.addEventListener('mouseleave', deactivate);
  el.addEventListener('touchstart', activate, {passive: false});
  el.addEventListener('touchend', deactivate, {passive: false});
  el.addEventListener('touchcancel', deactivate, {passive: false});
}

setupButton('btn-up', 'up');
setupButton('btn-down', 'down');
setupButton('btn-left', 'left');
setupButton('btn-right', 'right');
setupButton('btn-a', 'a');
setupButton('btn-b', 'b');

function resetRally(server) {
  ball.x = server === 'player' ? player.x : cpu.x;
  ball.y = server === 'player' ? player.y - 20 : cpu.y + 20;
  ball.z = 0;
  ball.vx = 0;
  ball.vy = 0;
  ball.vz = 0;
  ball.active = false;
}
resetRally('player');

function update() {
  // プレイヤー移動（押しっぱなし対応）
  if (input.left) player.x -= player.speed;
  if (input.right) player.x += player.speed;
  if (input.up) player.y -= player.speed;
  if (input.down) player.y += player.speed;

  // 移動範囲制限
  if (player.x < 48) player.x = 48;
  if (player.x > 336) player.x = 336;
  if (player.y < 230) player.y = 230;
  if (player.y > 400) player.y = 400;

  // CPU AI
  if (ball.active) {
    if (cpu.x < ball.x - 4) cpu.x += cpu.speed;
    else if (cpu.x > ball.x + 4) cpu.x -= cpu.speed;
  } else {
    if (cpu.x < 192) cpu.x += cpu.speed;
    else if (cpu.x > 192) cpu.x -= cpu.speed;
  }
  if (cpu.x < 48) cpu.x = 48;
  if (cpu.x > 336) cpu.x = 336;

  // ボール移動
  if (ball.active) {
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.z += ball.vz;
    ball.vz -= 0.15; // 重力

    if (ball.z <= 0) {
      ball.z = 0;
      if (ball.y < 50) {
        scorePlayer++;
        resetRally('cpu');
      } else if (ball.y > 410) {
        scoreCpu++;
        resetRally('player');
      }
    }
  }

  // サーブ / ショット入力
  if (!ball.active && input.a) {
    ball.active = true;
    ball.vx = (Math.random() - 0.5) * 2;
    ball.vy = -4.2;
    ball.vz = 2.2;
  } else if (ball.active) {
    let distP = Math.hypot(player.x - ball.x, player.y - ball.y);
    if (distP < 35 && ball.y > 190 && ball.y < 390) {
      if (input.a) {
        ball.vy = -4.8;
        ball.vz = 1.5;
        ball.vx = (ball.x - player.x) * 0.15;
      } else if (input.b) {
        ball.vy = -3.2;
        ball.vz = 4.5; // ロブ
        ball.vx = (ball.x - player.x) * 0.1;
      }
    }

    let distC = Math.hypot(cpu.x - ball.x, cpu.y - ball.y);
    if (distC < 35 && ball.y < 230 && ball.y > 70) {
      ball.vy = 4.8;
      ball.vz = 1.5;
      ball.vx = (ball.x - cpu.x) * 0.15;
    }
  }
}

function draw() {
  ctx.fillStyle = '#008080';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // コート本体
  ctx.fillStyle = '#228b22';
  ctx.fillRect(48, 40, 288, 352);

  // 白線
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.strokeRect(48, 40, 288, 352);

  ctx.beginPath();
  ctx.moveTo(192, 40);
  ctx.lineTo(192, 392);
  ctx.stroke();

  ctx.strokeRect(48, 120, 288, 192);

  // ネット
  ctx.fillStyle = '#111';
  ctx.fillRect(38, 212, 308, 12);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(38, 212, 308, 12);

  // スコア・案内
  ctx.fillStyle = '#fff';
  ctx.font = '13px "Courier New"';
  ctx.fillText(`CPU: ${scoreCpu}`, 55, 25);
  ctx.fillText(`YOU: ${scorePlayer}`, 55, 415);
  ctx.fillText(ball.active ? "ラリー中! [A]ショット [B]ロブ" : "サーブは[A]ボタン！", 130, 25);

  // キャラクター描画（スプライトシートから1コマ目を綺麗に切り出し）
  if (imageLoaded) {
    // スプライトシートのグリッドに基づき、左上の1コマ（1キャラ分）を正確に切り抜く
    const sw = spriteSheet.width / 10;
    const sh = spriteSheet.height / 9;
    
    // プレイヤー描画
    ctx.drawImage(spriteSheet, 0, 0, sw, sh, player.x - 16, player.y - 24, 32, 32);
    // CPU描画
    ctx.drawImage(spriteSheet, 0, 0, sw, sh, cpu.x - 16, cpu.y - 24, 32, 32);
  } else {
    ctx.fillStyle = '#ff69b4';
    ctx.beginPath(); ctx.arc(player.x, player.y, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#00fa9a';
    ctx.beginPath(); ctx.arc(cpu.x, cpu.y, 10, 0, Math.PI*2); ctx.fill();
  }

  // ボール影とボール
  let shadowY = ball.y + ball.z;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.arc(ball.x, shadowY, 4, 0, Math.PI*2); ctx.fill();

  let ballScreenY = ball.y - ball.z;
  ctx.fillStyle = '#ffffe0';
  ctx.beginPath(); ctx.arc(ball.x, ballScreenY, 5, 0, Math.PI*2); ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
