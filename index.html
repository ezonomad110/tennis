<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Tennis Game</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    h2 {
      margin: 2px 0;
      font-size: 16px;
      letter-spacing: 2px;
    }
    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #008080;
      border: 3px solid #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      padding: 6px;
      width: 100vw;
      max-width: 420px;
      box-sizing: border-box;
    }
    canvas {
      background-color: #008080;
      display: block;
      width: 100%;
      height: auto;
      max-height: 50vh;
    }
    .controller {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 8px;
      background-color: #b0b0b0;
      border: 3px solid #333;
      padding: 12px 20px;
      box-sizing: border-box;
      border-radius: 6px;
    }
    .joystick-base {
      position: relative;
      width: 100px;
      height: 100px;
      background-color: #222;
      border-radius: 50%;
      border: 3px solid #444;
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.8);
      touch-action: none;
    }
    .joystick-stick {
      position: absolute;
      top: 25px;
      left: 25px;
      width: 50px;
      height: 50px;
      background: radial-gradient(circle at 30% 30%, #ff3333, #990000);
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
      cursor: pointer;
      transition: transform 0.05s ease-out;
    }
    .action-buttons {
      display: flex;
      gap: 20px;
    }
    .btn-action-container {
      text-align: center;
    }
    .btn-action {
      width: 55px;
      height: 55px;
      background-color: #cc1111;
      color: #fff;
      border: 3px solid #7f1d1d;
      border-radius: 50%;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 5px 0 #7f1d1d;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-action:active, .btn-action.touch-active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #7f1d1d;
    }
  </style>
</head>
<body>

  <h2>RETRO TENNIS</h2>
  
  <div id="game-container">
    <canvas id="gameCanvas" width="384" height="432"></canvas>
    
    <div class="controller">
      <div class="joystick-base" id="joystickBase">
        <div class="joystick-stick" id="joystickStick"></div>
      </div>
      <div class="action-buttons">
        <div class="btn-action-container">
          <button class="btn-action" id="btn-b">B</button>
          <span style="font-size:11px; color:#222; font-weight:bold;">ロブ</span>
        </div>
        <div class="btn-action-container">
          <button class="btn-action" id="btn-a">A</button>
          <span style="font-size:11px; color:#222; font-weight:bold;">ショット</span>
        </div>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let scorePlayer = 0;
let scoreCpu = 0;

const player = { x: 192, y: 350, speed: 3.5, animFrame: 0, isMoving: false };
const cpu = { x: 192, y: 110, speed: 2.2, animFrame: 0, isMoving: false };
const ball = { x: 192, y: 330, z: 0, vx: 0, vy: 0, vz: 0, active: false };

let rallyCount = 0; // ラリー継続回数
let judgeMessage = { text: "", timer: 0 }; // ミス判定表示用
let effect = { x: 0, y: 0, timer: 0 };

const input = { moveX: 0, moveY: 0, a: false, b: false };

const keys = { up: false, down: false, left: false, right: false };
window.addEventListener('keydown', e => {
  if (e.code === 'ArrowUp') keys.up = true;
  if (e.code === 'ArrowDown') keys.down = true;
  if (e.code === 'ArrowLeft') keys.left = true;
  if (e.code === 'ArrowRight') keys.right = true;
  if (e.code === 'KeyZ' || e.code === 'Space') input.a = true;
  if (e.code === 'KeyX') input.b = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowUp') keys.up = false;
  if (e.code === 'ArrowDown') keys.down = false;
  if (e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'KeyZ' || e.code === 'Space') input.a = false;
  if (e.code === 'KeyX') input.b = false;
});

const base = document.getElementById('joystickBase');
const stick = document.getElementById('joystickStick');
const maxDist = 30;

function handleJoystickMove(clientX, clientY) {
  const rect = base.getBoundingClientRect();
  let dx = clientX - (rect.left + rect.width / 2);
  let dy = clientY - (rect.top + rect.height / 2);
  let dist = Math.hypot(dx, dy);
  if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
  input.moveX = dx / maxDist;
  input.moveY = dy / maxDist;
}

function resetJoystick() {
  stick.style.transform = `translate(0px, 0px)`;
  input.moveX = 0; input.moveY = 0;
}

let isDragging = false;
base.addEventListener('mousedown', (e) => { isDragging = true; handleJoystickMove(e.clientX, e.clientY); });
window.addEventListener('mousemove', (e) => { if (isDragging) handleJoystickMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; resetJoystick(); } });

base.addEventListener('touchstart', (e) => {
  e.preventDefault(); isDragging = true;
  handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: false});

window.addEventListener('touchmove', (e) => {
  if (isDragging) { e.preventDefault(); handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY); }
}, {passive: false});

window.addEventListener('touchend', () => { if (isDragging) { isDragging = false; resetJoystick(); } });

function setupActionButton(id, keyName) {
  const el = document.getElementById(id);
  if (!el) return;
  const activate = (e) => { e.preventDefault(); input[keyName] = true; el.classList.add('touch-active'); };
  const deactivate = (e) => { e.preventDefault(); input[keyName] = false; el.classList.remove('touch-active'); };
  el.addEventListener('mousedown', activate);
  el.addEventListener('mouseup', deactivate);
  el.addEventListener('mouseleave', deactivate);
  el.addEventListener('touchstart', activate, {passive: false});
  el.addEventListener('touchend', deactivate, {passive: false});
}
setupActionButton('btn-a', 'a');
setupActionButton('btn-b', 'b');

function resetRally() {
  let totalPoints = scorePlayer + scoreCpu;
  let isEven = (totalPoints % 2 === 0);

  player.x = isEven ? 140 : 244;
  player.y = 370;

  cpu.x = isEven ? 244 : 140;
  cpu.y = 95;

  ball.x = player.x;
  ball.y = player.y - 15;
  ball.z = 0;
  ball.vx = 0; ball.vy = 0; ball.vz = 0;
  ball.active = false;
  rallyCount = 0; // ラリールセット
}
resetRally();

function update() {
  let kx = 0, ky = 0;
  if (keys.left) kx = -1;
  if (keys.right) kx = 1;
  if (keys.up) ky = -1;
  if (keys.down) ky = 1;

  let mx = input.moveX !== 0 ? input.moveX : kx;
  let my = input.moveY !== 0 ? input.moveY : ky;

  if (mx !== 0 || my !== 0) {
    player.x += mx * player.speed;
    player.y += my * player.speed;
    player.isMoving = true;
    player.animFrame += 0.2;
  } else {
    player.isMoving = false;
    player.animFrame = 0;
  }

  if (player.x < 55) player.x = 55;
  if (player.x > 329) player.x = 329;
  if (player.y < 235) player.y = 235;
  if (player.y > 395) player.y = 395;

  if (ball.active) {
    if (cpu.x < ball.x - 4) { cpu.x += cpu.speed; cpu.isMoving = true; cpu.animFrame += 0.2; }
    else if (cpu.x > ball.x + 4) { cpu.x -= cpu.speed; cpu.isMoving = true; cpu.animFrame += 0.2; }
    else { cpu.isMoving = false; }
  } else {
    cpu.isMoving = false;
  }
  if (cpu.x < 75) cpu.x = 75;
  if (cpu.x > 309) cpu.x = 309;

  // ボール移動
  if (ball.active) {
    // ラリーが続くほど速度がアップ（最大1.8倍まで加速）
    let speedMult = 1 + Math.min(rallyCount * 0.08, 0.8);
    ball.x += ball.vx * speedMult;
    ball.y += ball.vy * speedMult;
    ball.z += ball.vz;
    ball.vz -= 0.14;

    if (ball.z <= 0) {
      ball.z = 0;
      // 着地判定（アウト・ネット・イン）
      if (ball.y < 65) {
        // 奥側エリアでの着地
        if (ball.x < 39 || ball.x > 345) {
          judgeMessage = { text: "OUT!", timer: 45 };
        }
        scorePlayer++;
        resetRally();
      } else if (ball.y > 405) {
        // 手前側エリアでの着地
        if (ball.x < 39 || ball.x > 345) {
          judgeMessage = { text: "OUT!", timer: 45 };
        }
        scoreCpu++;
        resetRally();
      }
    }
  }

  if (effect.timer > 0) effect.timer--;
  if (judgeMessage.timer > 0) judgeMessage.timer--;

  // サーブ
  if (!ball.active && (input.a || input.b)) {
    ball.active = true;
    ball.vx = (192 - ball.x) * 0.015;
    ball.vy = -4.5;
    ball.vz = 2.2;
    rallyCount = 1;
    effect = { x: player.x, y: player.y - 15, timer: 15 };
  } 
  // ラリー中の打球判定（A・Bボタン共通、ワイドな球は少し速度を落として追いつきやすく調整）
  else if (ball.active) {
    let distP = Math.hypot(player.x - ball.x, player.y - ball.y);
    if (distP < 45 && ball.y > 210 && ball.y < 390) {
      if (input.a || input.b) {
        rallyCount++;
        let isLob = input.b;
        
        // 角度（サイドへの切れ方）が急なほど、少しだけスピードを穏やかにして追いつきやすくする補正
        let angleFactor = 1 - Math.abs(player.x - ball.x) * 0.003;
        angleFactor = Math.max(angleFactor, 0.8);

        if (isLob) {
          ball.vy = -3.0 * angleFactor; 
          ball.vz = 4.8;
          ball.vx = (ball.x - player.x) * 0.09;
        } else {
          ball.vy = -4.8 * angleFactor; 
          ball.vz = 1.6;
          ball.vx = (ball.x - player.x) * 0.13;
        }
        effect = { x: ball.x, y: ball.y, timer: 15 };
      }
    }

    let distC = Math.hypot(cpu.x - ball.x, cpu.y - ball.y);
    if (distC < 45 && ball.y < 220 && ball.y > 60) {
      ball.vy = 5.2; 
      ball.vz = 1.6;
      ball.vx = (ball.x - cpu.x) * 0.15;
    }
  }
}

function drawDotCharacter(x, y, isPlayer, targetBallX) {
  ctx.save();
  ctx.translate(x, y);
  
  const ps = 2;
  let legOffset = 0;
  if (isPlayer && player.isMoving) {
    legOffset = Math.floor(player.animFrame) % 2 === 0 ? 1 : -1;
  } else if (!isPlayer && cpu.isMoving) {
    legOffset = Math.floor(cpu.animFrame) % 2 === 0 ? 1 : -1;
  }

  let isRacketLeft = targetBallX < x;

  if (isPlayer) {
    ctx.fillStyle = '#111';
    ctx.fillRect(-6 * ps, -12 * ps, 12 * ps, 4 * ps);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-6 * ps, -12 * ps, 12 * ps, ps);

    ctx.fillStyle = '#f5d0b1';
    ctx.fillRect(-4 * ps, -8 * ps, 8 * ps, 3 * ps);

    ctx.fillStyle = '#ff69b4';
    ctx.fillRect(-6 * ps, -5 * ps, 12 * ps, 7 * ps);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-2 * ps, -5 * ps, 4 * ps, 7 * ps);

    ctx.fillStyle = '#f5d0b1';
    ctx.fillRect(-4 * ps, 2 * ps + legOffset, 3 * ps, 4 * ps);
    ctx.fillRect(1 * ps, 2 * ps - legOffset, 3 * ps, 4 * ps);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-5 * ps, 5 * ps + legOffset, 4 * ps, 2 * ps);
    ctx.fillRect(1 * ps, 5 * ps - legOffset, 4 * ps, 2 * ps);

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    let racketX = isRacketLeft ? -10 * ps : 10 * ps;
    ctx.beginPath();
    ctx.ellipse(racketX, -4 * ps, 4 * ps, 6 * ps, isRacketLeft ? -Math.PI / 4 : Math.PI / 4, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

  } else {
    ctx.fillStyle = '#111';
    ctx.fillRect(-6 * ps, -12 * ps, 12 * ps, 4 * ps);
    ctx.fillStyle = '#00fa9a';
    ctx.fillRect(-6 * ps, -12 * ps, 12 * ps, ps);

    ctx.fillStyle = '#f5d0b1';
    ctx.fillRect(-4 * ps, -8 * ps, 8 * ps, 4 * ps);
    ctx.fillStyle = '#000';
    ctx.fillRect(-2 * ps, -7 * ps, ps, ps);
    ctx.fillRect(1 * ps, -7 * ps, ps, ps);

    ctx.fillStyle = '#00fa9a';
    ctx.fillRect(-6 * ps, -4 * ps, 12 * ps, 6 * ps);

    ctx.fillStyle = '#f5d0b1';
    ctx.fillRect(-4 * ps, 2 * ps + legOffset, 3 * ps, 4 * ps);
    ctx.fillRect(1 * ps, 2 * ps - legOffset, 3 * ps, 4 * ps);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-5 * ps, 5 * ps + legOffset, 4 * ps, 2 * ps);
    ctx.fillRect(1 * ps, 5 * ps - legOffset, 4 * ps, 2 * ps);

    let racketX = isRacketLeft ? -10 * ps : 10 * ps;
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(racketX, -4 * ps, 4 * ps, 6 * ps, isRacketLeft ? Math.PI / 4 : -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }

  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#008080';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 立体コート描画
  const tlX = 75, tlY = 65;
  const trX = 309, trY = 65;
  const brX = 345, brY = 405;
  const blX = 39, blY = 405;

  ctx.fillStyle = '#228b22';
  ctx.beginPath();
  ctx.moveTo(blX, blY); ctx.lineTo(tlX, tlY);
  ctx.lineTo(trX, trY); ctx.lineTo(brX, brY);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(192, 65);
  ctx.lineTo(192, 405);
  ctx.stroke();

  let sTopY = 65 + (405 - 65) * 0.35;
  let sTopLeftX = blX + (tlX - blX) * 0.35;
  let sTopRightX = brX + (trX - brX) * 0.35;
  let sBotY = 65 + (405 - 65) * 0.65;
  let sBotLeftX = blX + (tlX - blX) * 0.65;
  let sBotRightX = brX + (trX - brX) * 0.65;

  ctx.beginPath();
  ctx.moveTo(sTopLeftX, sTopY); ctx.lineTo(sTopRightX, sTopY);
  ctx.moveTo(sBotLeftX, sBotY); ctx.lineTo(sBotRightX, sBotY);
  ctx.stroke();

  let netY = 65 + (405 - 65) * 0.5;
  let netLeftX = blX + (tlX - blX) * 0.5 - 12;
  let netRightX = brX + (trX - brX) * 0.5 + 12;

  ctx.fillStyle = '#111';
  ctx.fillRect(netLeftX - 10, netY - 8, (netRightX - netLeftX) + 20, 16);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(netLeftX - 10, netY - 8, (netRightX - netLeftX) + 20, 16);

  // スコア表示 ＆ ラリー数表示
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px "Courier New"';
  ctx.fillText(`YOU: ${scorePlayer}`, 45, 25);
  ctx.fillText(`CPU: ${scoreCpu}`, 280, 25);
  ctx.fillText(ball.active ? `RALLY:${rallyCount}` : "サーブは[A/B]", 145, 25);

  // ミス判定（OUT!等）の文字表示演出
  if (judgeMessage.timer > 0) {
    ctx.fillStyle = '#ff3333';
    ctx.font = 'bold 28px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText(judgeMessage.text, canvas.width / 2, canvas.height / 2 - 20);
    ctx.textAlign = 'left';
  }

  // ヒットエリアの可視化
  if (ball.active && ball.y > 210 && ball.y < 390) {
    let distP = Math.hypot(player.x - ball.x, player.y - ball.y);
    ctx.strokeStyle = distP < 45 ? 'rgba(0, 255, 255, 0.8)' : 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y - 10, 45, 0, Math.PI * 2);
    ctx.stroke();
  }

  drawDotCharacter(player.x, player.y, true, ball.x);
  drawDotCharacter(cpu.x, cpu.y, false, ball.x);

  // ボールと影
  let shadowY = ball.y + ball.z;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.arc(ball.x, shadowY, 4, 0, Math.PI*2); ctx.fill();

  let ballScreenY = ball.y - ball.z;
  ctx.fillStyle = '#ffffe0';
  ctx.beginPath(); ctx.arc(ball.x, ballScreenY, 5, 0, Math.PI*2); ctx.fill();

  if (effect.timer > 0) {
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = 3;
    let size = 16 - effect.timer;
    ctx.beginPath();
    ctx.moveTo(effect.x - size, effect.y); ctx.lineTo(effect.x + size, effect.y);
    ctx.moveTo(effect.x, effect.y - size); ctx.lineTo(effect.x, effect.y + size);
    ctx.stroke();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
