<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Tennis — レトロテニス</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>🎾 RETRO TENNIS</h1>
    <p class="sub">ファミコン時代のテニスゲームへのオマージュ — オリジナル作品です</p>

    <section class="selectors">
      <div>
        <h2>選手を選ぶ</h2>
        <div id="charSelect" class="btnrow"></div>
        <p id="charInfo" class="info"></p>
      </div>
      <div>
        <h2>コートを選ぶ</h2>
        <div id="courtSelect" class="btnrow"></div>
        <p id="courtInfo" class="info"></p>
      </div>
      <button id="btnApply" class="apply">この条件で試合開始</button>
    </section>

    <div class="hud">
      <div class="scorebox">
        <span><span id="playerName">YOU</span> <strong id="playerGames">0</strong> — <span id="playerPoints">0</span></span>
        <span class="vs">|</span>
        <span>CPU <strong id="cpuGames">0</strong> — <span id="cpuPoints">0</span></span>
      </div>
      <div id="message" class="message">SPACE でサーブ！</div>
    </div>

    <canvas id="game" width="480" height="560"></canvas>

    <div class="controls">
      <p><strong>移動:</strong> ←↑↓→ / WASD</p>
      <p><strong>Aボタン（Z / SPACE）:</strong> トップスピン　<strong>Bボタン（X）:</strong> スライス　<strong>Cボタン（C）:</strong> ロブ</p>
      <p class="hint">ネット近くでバウンド前に打つとボレー、高い球×Aボタンでスマッシュ。サーブは2ndになると安全なスライスサーブになります。<strong>R:</strong> リスタート</p>
    </div>

    <div class="touch">
      <button id="btnLeft">◀</button>
      <button id="btnUp">▲</button>
      <button id="btnDown">▼</button>
      <button id="btnRight">▶</button>
      <button id="btnTop" class="swing">A スピン</button>
      <button id="btnSlice">B スライス</button>
      <button id="btnLob">C ロブ</button>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
